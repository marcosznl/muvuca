<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Muvuca</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="theme-color" content="#1e1f22">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <img src="icon.svg" alt="" width="48" height="48">
      <h1>Painel do Muvuca</h1>
      <p class="muted">Acesso restrito ao administrador.</p>
      <label>Usuário <input id="login-user" name="user" autocomplete="username" required></label>
      <label>Senha <input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="btn primary">Entrar</button>
      <button type="button" id="login-passkey" class="btn" hidden>Entrar com Face ID / Touch ID</button>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <nav class="side">
      <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Painel</span></div>
      <!-- Abas (páginas): montadas pelo app.js; no celular viram o seletor abaixo -->
      <div id="side-pages" class="side-pages"></div>
      <select id="tab-select" class="tab-select" aria-label="Escolher aba"></select>
      <div class="side-foot">
        <span id="updated" class="muted small"></span>
        <button id="logout" class="btn ghost small">Sair</button>
      </div>
    </nav>
    <section class="content">
      <header class="top"><h1 id="title">Visão geral</h1>
        <div class="top-search" role="search">
          <input id="busca" type="search" placeholder="Buscar pessoa, IP ou mensagem… (Ctrl+K)" aria-label="Buscar no painel" autocomplete="off">
          <div id="busca-res" class="busca-res" hidden></div>
        </div>
        <div id="top-status"></div></header>
      <nav id="subtabs" class="subtabs" hidden></nav>
      <div id="view"></div>
    </section>
  </div>
</body>
</html>
