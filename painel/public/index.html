<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do Muvuca</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="theme-color" content="#1e1f22">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <img src="icon.svg" alt="" width="48" height="48">
      <h1>Painel do Muvuca</h1>
      <p class="muted">Acesso restrito ao administrador.</p>
      <label>Usuário <input id="login-user" name="user" autocomplete="username" required></label>
      <label>Senha <input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="btn primary">Entrar</button>
      <button type="button" id="login-passkey" class="btn" hidden>Entrar com Face ID / Touch ID</button>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <nav class="side">
      <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Painel</span></div>
      <!-- Abas em grupos; no celular viram uma lista só (o app.js monta a partir destes grupos) -->
      <div class="side-group">
        <button data-tab="geral" class="on">Visão geral</button>
        <button data-tab="aovivo">Ao vivo</button>
      </div>
      <div class="side-group" data-label="Pessoas">
        <button data-tab="usuarios">Usuários</button>
        <button data-tab="convites">Convites</button>
        <button data-tab="xp">XP e níveis</button>
      </div>
      <div class="side-group" data-label="Conversas">
        <button data-tab="mensagens">Mensagens</button>
        <button data-tab="arquivos">Arquivos</button>
        <button data-tab="resumo">Resumo da semana</button>
      </div>
      <div class="side-group" data-label="Segurança">
        <button data-tab="auditoria">Auditoria</button>
        <button data-tab="acessos">Acessos ao site</button>
        <button data-tab="seguranca">Login do painel</button>
      </div>
      <div class="side-group" data-label="Mac e internet">
        <button data-tab="sistema">Sistema</button>
        <button data-tab="internet">Internet</button>
        <button data-tab="quedas">Quedas</button>
        <button data-tab="alertas">Alertas no celular</button>
        <button data-tab="logs">Logs</button>
      </div>
      <div class="side-group" data-label="Manutenção">
        <button data-tab="atualizar">Atualizar o Muvuca</button>
        <button data-tab="backups">Backups</button>
      </div>
      <div class="side-group" data-label="Jogos">
        <button data-tab="minecraft">Minecraft</button>
      </div>
      <select id="tab-select" class="tab-select" aria-label="Escolher aba"></select>
      <div class="side-foot">
        <span id="updated" class="muted small"></span>
        <button id="logout" class="btn ghost small">Sair</button>
      </div>
    </nav>
    <section class="content">
      <header class="top"><h1 id="title">Visão geral</h1><div id="top-status"></div></header>
      <div id="view"></div>
    </section>
  </div>
</body>
</html>
