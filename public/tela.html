<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sala de tela · Muvuca</title>
  <!-- Sala avulsa para compartilhar a tela e a câmera, criada pelo bot Muvuca do Discord (/tela). Ver src/tela.js.
       Usa os mesmos quadros e controles da call do site (style.css). -->
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: flex; flex-direction: column; }
    .tela-topo { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bg-side); border-bottom: 1px solid var(--bg-dark); }
    .tela-topo h1 { font-size: 16px; margin: 0; color: var(--text-strong); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tela-topo h1 span { color: var(--muted); font-weight: 400; }
    .tela-pessoas { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .tela-aviso { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 16px; text-align: center; }
    .tela-aviso p { margin: 0; max-width: 420px; }
    .tela-aviso a.btn { text-decoration: none; }
    /* Foto do Discord no lugar da inicial colorida */
    .tile img.avatar { object-fit: cover; background: var(--tile); }
    /* Janela do sistema (por cima de outros programas), embaixo do botão de tela cheia */
    .tile .pip {
      position: absolute; right: 8px; top: 44px; padding: 6px; line-height: 0;
      background: rgba(0,0,0,.6); border-radius: 6px; color: #fff;
    }
    .tile .pip:hover { background: rgba(0,0,0,.8); }
  </style>
</head>
<body>
  <header class="tela-topo">
    <h1>Sala de tela <span id="nome-sala"></span></h1>
    <span id="pessoas" class="tela-pessoas"></span>
  </header>

  <!-- Avisos (som bloqueado, câmera sem permissão), os mesmos do site -->
  <div id="banner" class="banner" hidden></div>

  <section id="aviso" class="tela-aviso">
    <p>Carregando…</p>
  </section>

  <section id="sala" class="voice-view" hidden>
    <div class="call-pane">
      <div id="stage" class="stage"></div>
      <footer class="controls">
        <button id="btn-cam" class="ctrl round" title="Ligar câmera" data-icon="video-off"></button>
        <button id="btn-flip" class="ctrl round" title="Virar câmera" data-icon="flip-camera" hidden></button>
        <button id="btn-screen" class="ctrl round" title="Transmitir tela" data-icon="monitor-up"></button>
        <button id="btn-stats" class="ctrl round" title="Mostrar qualidade" data-icon="bar-chart"></button>
        <button id="btn-leave" class="ctrl round danger" title="Sair da sala" data-icon="phone-off"></button>
      </footer>
    </div>
  </section>

  <!-- Janelas e menus abrem aqui por cima de tudo -->
  <div id="overlay-layer"></div>

  <script src="/livekit-client.js"></script>
  <script type="module" src="/js/tela.js"></script>
</body>
</html>
