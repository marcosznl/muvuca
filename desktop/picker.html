<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Transmitir tela</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px -apple-system, "Noto Sans", sans-serif; background: #2b2d31; color: #dbdee1; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 18px 20px 8px; }
  h1 { margin: 0 0 4px; font-size: 18px; color: #f2f3f5; }
  p { margin: 0; color: #949ba4; font-size: 13px; }
  .tabs { display: flex; gap: 6px; padding: 10px 20px; }
  .tabs button { background: none; border: 0; color: #949ba4; font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .tabs button.on { background: #404249; color: #f2f3f5; }
  .grid { flex: 1; overflow-y: auto; padding: 6px 20px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; align-content: start; }
  .item { background: #1e1f22; border: 2px solid transparent; border-radius: 8px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .item:hover { border-color: #5865f2; }
  .item img.thumb { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #000; border-radius: 4px; display: block; }
  .name { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .name img { width: 16px; height: 16px; flex: none; }
  footer { padding: 12px 20px; display: flex; justify-content: flex-end; border-top: 1px solid #1e1f22; }
  footer button { background: none; border: 0; color: #dbdee1; font: inherit; cursor: pointer; padding: 8px 14px; }
  footer button:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header><h1>Transmitir tela</h1><p>Escolha o que a galera vai ver.</p></header>
  <div class="tabs"><button id="t-screen" class="on">Telas</button><button id="t-window">Janelas</button></div>
  <div id="grid" class="grid"></div>
  <footer><button id="cancel">Cancelar</button></footer>
<script>
  let all = [];
  let showScreens = true;
  const grid = document.getElementById('grid');
  function paint() {
    grid.replaceChildren();
    for (const s of all.filter((x) => x.screen === showScreens)) {
      const b = document.createElement('button');
      b.className = 'item';
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = s.thumb;
      const name = document.createElement('div');
      name.className = 'name';
      if (s.icon) { const i = document.createElement('img'); i.src = s.icon; name.append(i); }
      name.append(s.name);
      b.append(img, name);
      b.onclick = () => window.picker.choose(s.id);
      grid.append(b);
    }
  }
  const tab = (screens) => () => {
    showScreens = screens;
    document.getElementById('t-screen').classList.toggle('on', screens);
    document.getElementById('t-window').classList.toggle('on', !screens);
    paint();
  };
  document.getElementById('t-screen').onclick = tab(true);
  document.getElementById('t-window').onclick = tab(false);
  document.getElementById('cancel').onclick = () => window.picker.choose(null);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.picker.choose(null); });
  window.picker.sources().then((s) => { all = s; paint(); });
</script>
</body>
</html>
